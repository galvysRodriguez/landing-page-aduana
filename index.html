  <title>Customs Broker de Venezuela</title>
<script type="text/javascript">
  // Esta función la llamaremos DESDE React para asegurar que el div exista
  window.initGoogleTranslate = function() {
    new google.translate.TranslateElement({
      pageLanguage: 'en',
      includedLanguages: 'en,es',
      autoDisplay: false
    }, 'google_translate_element');
  }

  window.triggerGoogleTranslate = function(langCode) {
    var select = document.querySelector('select.goog-te-combo');
    if (select) {
      select.value = langCode;
      select.dispatchEvent(new Event('change', { bubbles: true }));
    }

    const domain = window.location.hostname;
    document.cookie = `googtrans=/es/${langCode}; domain=${domain}; path=/`;
    document.cookie = `googtrans=/es/${langCode}; path=/`;
    
    // Recargar sutilmente si Google no reacciona automáticamente
    
        window.location.reload();
    
  }
</script>
