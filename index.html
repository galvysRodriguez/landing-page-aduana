<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customs Broker de Venezuela</title>
<script type="text/javascript">
  function googleTranslateElementInit() {
    new google.translate.TranslateElement({
      pageLanguage: 'es',
      includedLanguages: 'en,es',
      autoDisplay: false
    }, 'google_translate_element');
  }

  window.triggerGoogleTranslate = function(langCode) {
    const domain = window.location.hostname;
    const cookieValue = `/es/${langCode}`;
    
    // Si es español, borramos las cookies de traducción para evitar conflictos
    if (langCode === 'es') {
      document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
      document.cookie = `googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; domain=${domain}; path=/;`;
    } else {
      // Si es inglés, forzamos las cookies
      document.cookie = `googtrans=${cookieValue}; path=/;`;
      document.cookie = `googtrans=${cookieValue}; domain=${domain}; path=/;`;
    }

    // Intentar cambiar el selector sin recargar si es posible
    var select = document.querySelector('select.goog-te-combo');
    if (select) {
      select.value = langCode;
      select.dispatchEvent(new Event('change', { bubbles: true }));
    } else {
      // Solo recargamos si el widget de Google no respondió
      window.location.reload();
    }
  }
</script>
<script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
