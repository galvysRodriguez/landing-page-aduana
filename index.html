<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/landing-page-aduana/assets/logo-BY83WRix.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customs Broker de Venezuela</title>
<script type="text/javascript">
  // Esta función la llamaremos DESDE React para asegurar que el div exista
  window.initGoogleTranslate = function() {
    new google.translate.TranslateElement({
      pageLanguage: 'es',
      includedLanguages: 'en,es',
      autoDisplay: false
    }, 'google_translate_element');
  }

  window.triggerGoogleTranslate = function(langCode) {
    const domain = window.location.hostname;
    const select = document.querySelector('select.goog-te-combo');

    if (langCode === 'es') {
        // 1. Borrar cookies en todas sus variantes (con y sin punto de dominio)
        document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
        document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; domain=" + domain + "; path=/;";
        document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; domain=." + domain + "; path=/;";
        
        // 2. Forzar recarga inmediata para limpiar el estado de Google
        window.location.reload();
        return;
    } 
    
    if (langCode === 'en') {
        // 1. Establecer cookie de traducción
        const cookieValue = "/es/en";
        document.cookie = `googtrans=${cookieValue}; path=/;`;
        document.cookie = `googtrans=${cookieValue}; domain=${domain}; path=/;`;

        // 2. Intentar disparar el cambio sin recargar
        if (select) {
            select.value = langCode;
            select.dispatchEvent(new Event('change', { bubbles: true }));
        } else {
            // Si el widget no está listo, recargamos para que lea la cookie nueva
            window.location.reload();
        }
    }
}
</script>
<script type="text/javascript" src="//translate.google.com/translate_a/element.js"></script>
