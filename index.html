<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/assets/logo-BY83WRix.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customs Broker de Venezuela</title>
<script type="text/javascript">
  // Inicialización estándar
  function googleTranslateElementInit() {
    new google.translate.TranslateElement({
      pageLanguage: 'es',
      includedLanguages: 'en,es',
      autoDisplay: false
    }, 'google_translate_element');
  }

  window.triggerGoogleTranslate = function(langCode) {
    const domain = window.location.hostname;
    const cookieName = "googtrans";
    const cookieValue = `/es/${langCode}`;

    if (langCode === 'es') {
      // Limpieza profunda de cookies para volver al origen sin errores
      document.cookie = `${cookieName}=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;`;
      document.cookie = `${cookieName}=; expires=Thu, 01 Jan 1970 00:00:00 UTC; domain=${domain}; path=/;`;
      document.cookie = `${cookieName}=; expires=Thu, 01 Jan 1970 00:00:00 UTC; domain=.${domain}; path=/;`;
      
      // Recarga obligatoria para limpiar etiquetas <font> de Google
      window.location.reload();
      return;
    }

    if (langCode === 'en') {
      // Establecer cookie para el host
      document.cookie = `${cookieName}=${cookieValue}; path=/;`;
      document.cookie = `${cookieName}=${cookieValue}; domain=${domain}; path=/;`;
      
      // Intentar usar el widget si ya cargó, sino recargar
      const select = document.querySelector('select.goog-te-combo');
      if (select) {
        select.value = langCode;
        select.dispatchEvent(new Event('change', { bubbles: true }));
      } else {
        window.location.reload();
      }
    }
  };
</script>
<script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</head>

</body>

</html>
