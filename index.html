<!doctype html>

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline' 'unsafe-eval' https://translate.google.com https://translate.googleapis.com;">
  <title>Customs Broker de Venezuela</title>
<script type="text/javascript">
  function googleTranslateElementInit() {
    new google.translate.TranslateElement({
      pageLanguage: 'es',
      includedLanguages: 'en,es',
      autoDisplay: false
    }, 'google_translate_element');
  }

  window.triggerGoogleTranslate = function(langCode) {
    // 1. Intentamos cambiar el selector si existe
    var select = document.querySelector('select.goog-te-combo');
    
    // 2. Forzamos la cookie (La clave para Producción)
    // El formato debe ser: /idioma_origen/idioma_destino
    const cookieValue = `/es/${langCode}`;
    const domain = window.location.hostname;
    
    // Escribimos la cookie en todas las variantes posibles para asegurar que el host la tome
    document.cookie = `googtrans=${cookieValue}; path=/;`;
    document.cookie = `googtrans=${cookieValue}; domain=.${domain}; path=/;`;
    document.cookie = `googtrans=${cookieValue}; domain=${domain}; path=/;`;

    if (select) {
      select.value = langCode;
      select.dispatchEvent(new Event('change', { bubbles: true }));
    } else {
      // Si el script de Google se "durmió", recargamos la página.
      // Al recargar, Google leerá la cookie que acabamos de escribir y traducirá al instante.
      window.location.reload();
    }
  }
</script>
<script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
